<style>
:root{
  --ink:#0d0b1c; --p0:#12142c; --p1:#1c1f3f; --p2:#272c57; --p3:#343c72; --hi:#717bbd; --lo:#151834;
  --text:#eef0ff; --dim:#a8aed8; --gold:#f5c451; --gold2:#c98f1f; --aether:#6fe3f5; --violet:#a35cff;
  --hp:#e8364e; --hp2:#9e1a30; --mp:#3b8cff; --mp2:#1d4fae; --xp:#8ee36b;
  --px:'Pixelify Sans',ui-rounded,system-ui,sans-serif; --ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --frame:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
/* iOS Safari combines touch-action with every ancestor, so only the game canvases block gestures; menus keep their own scrolling */
.fullcv,#miniCv{touch-action:none}
canvas{display:block}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--aether);outline-offset:3px}
img{image-rendering:pixelated;image-rendering:crisp-edges;-webkit-user-drag:none;pointer-events:none}
.hidden{display:none!important}
.ol{text-shadow:-1px 0 var(--ink),1px 0 var(--ink),0 -1px var(--ink),0 1px var(--ink),0 2px var(--ink)}
.pf{background:linear-gradient(var(--p2),var(--p1));box-shadow:var(--frame),inset 0 0 0 2px var(--hi),inset 0 0 0 4px var(--lo)}
.pf.gold{background:linear-gradient(#ffe39a,#f5c451 45%,#cf9424);color:#2b1a00;box-shadow:var(--frame),inset 0 0 0 2px #fff3c4,inset 0 0 0 4px #9a6a10}
.pf.pink{background:linear-gradient(#ffc4dd,#e86aa0);color:#3a0a22;box-shadow:var(--frame),inset 0 0 0 2px #ffe0ee,inset 0 0 0 4px #9a2a5a}
.bhs{display:inline-flex;gap:2px;vertical-align:middle}
.bh{display:inline-block;width:9px;height:8px;background:#3a2f5a;clip-path:polygon(0 25%,25% 0,50% 25%,75% 0,100% 25%,100% 50%,50% 100%,0 50%)}
.bh.on{background:#ff7ab4}
.bq{margin:0 0 10px;padding:10px 12px;background:rgba(255,122,180,.08);border-left:3px solid #ff9ac8;font-style:italic;font-size:14px;line-height:1.4}
.bondup{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:14px;align-items:center}
@media (max-width:560px){.bondup{grid-template-columns:1fr}.bondup .hero-stage img{height:150px!important}}
@media (max-height:520px){.bondup .hero-stage{min-height:0;padding:6px}.bondup .hero-stage img{height:130px!important}.bondup .bq{font-size:13px;padding:8px 10px;margin-bottom:6px}}
.bsum{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin:6px 0;font-size:12px;color:#ffd0e4}
.bsum span{display:inline-flex;align-items:center;gap:4px}
.bsum img{width:20px;height:20px;image-rendering:pixelated}
.bsum b{color:#ff9ac8}
.gdot{width:22px;height:22px;flex:none;box-shadow:0 0 0 2px var(--ink),inset -4px -4px 0 rgba(0,0,0,.25)}
.pity{display:grid;grid-template-columns:1fr 1fr auto;gap:10px 14px;align-items:end;margin-top:12px;padding:10px 12px;background:rgba(8,10,28,.45);box-shadow:var(--frame),inset 0 0 0 2px #2f3670}
.pbar span{font-size:12px;color:var(--dim)}.pbar b{color:#ffe9a8}.pbar em{color:#ffc65a;font-style:normal}
@media (max-width:620px){.pity{grid-template-columns:1fr}}
#story{position:fixed;inset:0;z-index:50;display:none;background:linear-gradient(rgba(5,6,18,.15),rgba(5,6,18,.55) 55%,rgba(5,6,18,.85));cursor:pointer;-webkit-user-select:none;user-select:none}
#story.on{display:block}
#story .stitle{position:absolute;left:0;right:0;top:28%;padding:16px 0 18px;background:linear-gradient(90deg,transparent,rgba(8,8,26,.85) 25%,rgba(8,8,26,.85) 75%,transparent);text-align:center;transition:opacity .5s,transform .5s;pointer-events:none}

#story.top .sskip{top:auto;bottom:calc(12px + var(--sb));right:auto;left:calc(14px + var(--sl))}
#story .sbox.right{flex-direction:row-reverse}

#story .sbox.right .snext{right:auto;left:16px}
@keyframes snb{50%{transform:translateY(3px);opacity:.5}}
#story .sskip{position:absolute;right:calc(14px + var(--sr));top:calc(12px + var(--st));min-height:34px;padding:4px 16px;font-size:13px}
@media (max-height:440px){#story .sbox{min-height:96px;padding:10px 14px 14px}#story .spor{width:64px;height:70px}#story .spor img{width:60px;height:66px}#story .sln{font-size:14px;min-height:40px}#story .snm{font-size:15px;margin-bottom:3px}#story .stitle b{font-size:28px}}
.rels{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}
.rels span{display:inline-flex;align-items:center;gap:6px;font-size:12px}

.rels b{font:700 12px var(--px)}
.rels i{font-style:normal;font-size:11px}
.injm{position:absolute;left:4px;top:4px;width:10px;height:10px;box-shadow:0 0 0 2px var(--ink);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)}

.hsn{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;font:700 14px var(--px);background:#1e2350;box-shadow:var(--frame);color:#c8b8ff}
#cutin{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden;display:none}
#cutin.go{display:block}
#cutin .cband{position:absolute;left:-10%;right:-10%;top:30%;height:min(30vh,150px);transform:skewY(-6deg);background:linear-gradient(90deg,rgba(8,8,26,.0),rgba(8,8,26,.92) 18%,rgba(8,8,26,.92) 82%,rgba(8,8,26,0));border-top:3px solid var(--c);border-bottom:3px solid var(--c);display:flex;align-items:center;justify-content:center;gap:16px;animation:cband 1.2s cubic-bezier(.2,.9,.2,1) forwards}
#cutin img{height:170%;image-rendering:pixelated;transform:skewY(6deg) translateY(-6%);animation:cimg 1.2s cubic-bezier(.2,.9,.2,1) forwards;filter:drop-shadow(0 0 12px var(--c))}
#cutin .ctx{transform:skewY(6deg);animation:ctx 1.2s ease forwards}
#cutin .ctx b{display:block;font:700 clamp(26px,6vh,44px) var(--px);color:#fff;letter-spacing:.04em}
#cutin .ctx small{display:block;font:700 14px var(--px);color:var(--c)}
@keyframes cband{0%{clip-path:inset(0 100% 0 0)}15%{clip-path:inset(0 0 0 0)}82%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 100%);opacity:0}}
@keyframes cimg{0%{transform:skewY(6deg) translate(-60px,-6%)}20%{transform:skewY(6deg) translate(0,-6%)}100%{transform:skewY(6deg) translate(18px,-6%)}}
@keyframes ctx{0%{opacity:0;transform:skewY(6deg) translateX(40px)}25%{opacity:1;transform:skewY(6deg) translateX(0)}100%{opacity:1;transform:skewY(6deg) translateX(-10px)}}
.ttl{display:inline-block;font:700 11px var(--px);color:#ffd36b;background:rgba(255,211,107,.12);box-shadow:0 0 0 1px rgba(255,211,107,.5);padding:1px 6px;margin-left:4px}
.ttls{display:flex;flex-wrap:wrap;gap:6px}.ttls .btn{min-height:32px;padding:4px 12px;font-size:13px}
.tok{color:#ffd36b;font-weight:700}
.evcard{box-shadow:var(--frame),inset 0 0 0 2px var(--ec)!important;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent)}
.evcard.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--ec) 18%,transparent),transparent)}
.evst{display:flex;gap:4px;margin:6px 0 4px}.evst i{width:16px;height:8px;background:#2a2f5a;box-shadow:0 0 0 1px #0d0b1c}.evst i.on{background:var(--ec)}.evst i.nx{background:#fff;opacity:.6}.evst i.gd{width:22px}
.sw{display:inline-flex;flex:none;box-shadow:0 0 0 2px var(--ink)}.sw i{width:12px;height:28px}
.tiphl{position:relative;animation:tiphl 1s ease-in-out infinite;z-index:5}
@keyframes tiphl{50%{box-shadow:0 0 0 3px #d8a8ff,0 0 22px 6px rgba(216,168,255,.7)}}
#sumx{position:fixed;inset:0;z-index:55;display:none;background:radial-gradient(ellipse at 50% 30%,#1c1846,#07061a 70%);overflow:hidden;-webkit-user-select:none;user-select:none}
#sumx.on{display:block}
#sumx{--c:#9ad0ff;--c2:#ffffff}#sumx.sr{--c:#7ab8ff;--c2:#cfe8ff}#sumx.ssr{--c:#c88bff;--c2:#f0d8ff}#sumx.ur{--c:#ffc65a;--c2:#fff3c4}
.sxsky{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#fff,transparent),radial-gradient(1px 1px at 40% 65%,#cfe8ff,transparent),radial-gradient(1.5px 1.5px at 85% 55%,#fff,transparent),radial-gradient(1px 1px at 25% 85%,#fff,transparent),radial-gradient(1px 1px at 58% 35%,#d8c8ff,transparent),radial-gradient(1.5px 1.5px at 8% 50%,#fff,transparent),radial-gradient(1px 1px at 92% 88%,#fff,transparent);animation:sxtw 3s ease-in-out infinite}
@keyframes sxtw{50%{opacity:.5}}
.sxfall i{position:absolute;top:-30%;width:6px;height:120px;border-radius:3px;background:linear-gradient(transparent,var(--c),#fff);box-shadow:0 0 18px 6px var(--c);animation:sxfall 1.1s cubic-bezier(.5,0,.8,.4) forwards}
.sxfall i::after{content:'';position:absolute;left:50%;bottom:-14px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:radial-gradient(#fff,var(--c) 40%,transparent 70%)}
.sxfall.ur i{background:linear-gradient(transparent,#ff6b8a,#ffc65a,#7dff9c,#6fe3f5,#fff);box-shadow:0 0 26px 10px #ffc65a}
@keyframes sxfall{to{top:62%;opacity:1}}
.sxcards{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:0 calc(16px + var(--sr)) 0 calc(16px + var(--sl));perspective:800px}
.sxcards.n10{max-width:min(600px,96vw);margin:0 auto}
.sxc{width:min(17vw,104px);aspect-ratio:3/4.2;cursor:pointer;animation:sxin .45s cubic-bezier(.2,.9,.3,1.2) backwards}
.sxcards.n1 .sxc{width:min(42vw,170px)}
.sxc:nth-child(2){animation-delay:.05s}.sxc:nth-child(3){animation-delay:.1s}.sxc:nth-child(4){animation-delay:.15s}.sxc:nth-child(5){animation-delay:.2s}.sxc:nth-child(6){animation-delay:.25s}.sxc:nth-child(7){animation-delay:.3s}.sxc:nth-child(8){animation-delay:.35s}.sxc:nth-child(9){animation-delay:.4s}.sxc:nth-child(10){animation-delay:.45s}
@keyframes sxin{from{opacity:0;transform:translateY(40px) scale(.8)}}
.sxc .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.sxc.flip .in{transform:rotateY(180deg)}
.sxc .bk,.sxc .fr{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--frame)}
.sxc .bk{background:linear-gradient(135deg,#2a2f6a,#141738);display:flex;align-items:center;justify-content:center;font-size:28px;color:#6a74c8}
.sxc.sr .bk{box-shadow:var(--frame),0 0 14px 2px #7ab8ff}.sxc.ssr .bk{box-shadow:var(--frame),0 0 18px 4px #c88bff;color:#e0c0ff}.sxc.ur .bk{box-shadow:var(--frame),0 0 24px 6px #ffc65a;color:#ffe9a8;animation:sxpulse 1s ease-in-out infinite}

.sxc.sr .fr{background:linear-gradient(#2a4a8a,#101a3a)}.sxc.ssr .fr{background:linear-gradient(#5a2f9a,#1a0f3a)}.sxc.ur .fr{background:linear-gradient(#b8862a,#3a2408)}
.sxc .fr img{width:100%;flex:1;object-fit:contain;image-rendering:pixelated;min-height:0}
.sxc .st{font-size:11px;color:#ffd36b;letter-spacing:-1px}.sxc .nm{font:700 13px var(--px);color:#fff}.sxc .tg{font-size:10px;color:#9ad0ff}
.sxbar{position:absolute;left:0;right:0;bottom:calc(14px + var(--sb));display:flex;justify-content:center;gap:10px}
.sxskip{position:absolute;right:calc(14px + var(--sr));top:calc(12px + var(--st));min-height:34px;padding:4px 16px;font-size:13px;z-index:3}

@keyframes sxrot{to{transform:rotate(360deg)}}

.afx{display:flex;gap:4px;margin:3px 0 1px}#zTitle .afx i,.afx i{text-shadow:none!important;-webkit-text-stroke:0!important;paint-order:normal!important;font:800 11px/1.3 system-ui,sans-serif!important;font-style:normal;letter-spacing:.02em;padding:1px 6px;color:#0d0b1c;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.5)}

.screen{position:fixed;inset:0;display:none}

.fullcv{position:absolute;inset:0;width:100%;height:100%}

<script>
'use strict';
/* ================= core utilities ================= */
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));

const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);

const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };

}
const fbm = (n, x, y) => n(x, y) * 0.6 + n(x * 2.1 + 17, y * 2.1 + 9) * 0.3 + n(x * 4.3 + 3, y * 4.3 + 41) * 0.1;

/* ================= save ================= */
const SAVE_KEY = 'aetherfall.v3';
// every account starts with its own trio of low-rank heroes: one frontliner, one damage dealer, one healer

function sfx0(name) {

/* ================= summon pity & starlight ================= */
const PITY5 = 80, SOFT5 = 60, PITY4 = 10;
const SPARK = { 4: 120, 5: 250 };

const REFINE_GOLD = 1500, REFINE_DAY = 3;

function pityOf() { return SV.pity || (SV.pity = { p5: 0, p4: 0, light: 0 }); }
function rate5() { const p = pityOf(); return p.p5 + 1 >= PITY5 ? 1 : 0.015 + Math.max(0, p.p5 + 1 - SOFT5) * 0.06; }
function pullStar(min) {
  const p = pityOf(); let st;
  if (Math.random() < rate5()) st = 5;
  else if (p.p4 + 1 >= PITY4) st = 4;
  else { const r = 0.015 + Math.random() * 0.985; let acc = 0; st = 1; for (const [s, q] of RATES) { acc += q; if (r < acc) { st = s; break; } } if (st === 5) st = 4; }
  st = Math.max(st, min || 1);
  p.p5++; p.p4++; p.light++;
  if (st === 5) { p.p5 = 0; p.p4 = 0; } else if (st === 4) p.p4 = 0;
  return st;
}

function grantHero(id) {
  const o = SV.owned[id]; let tag;
  if (!o) { SV.owned[id] = { lb: 0, mor: 70, bx: 0 }; tag = 'New!'; if (SV.party.length < 4) SV.party.push(id); if (HEROES[id].star >= 4) { SV.bondQ = SV.bondQ || []; SV.bondQ.push([id, 'meet']); } }
  else if (o.lb < 5) { o.lb++; tag = 'Limit break +' + o.lb; addBond(id, 5); }

// Heroes who know you exist know what you are: someone from another world, for whom this is a game.

const RELY0 = { loyal: 70, gentle: 60, stalwart: 60, lazy: 55, greedy: 50, reckless: 45, aloof: 40, proud: 38 };

function relyCol(r) { return r >= 80 ? '#7dff9c' : r >= 55 ? '#b8f07a' : r >= 35 ? '#ffd36b' : r >= 20 ? '#ff9a4d' : '#ff5b73'; }
const RELY_DOWN = {
  loyal: 'I followed you... and I nearly died. Please, think it through next time.', proud: 'You led me into that! This is not a game to me!',
  reckless: 'Okay, even I think that was too much.', gentle: 'That hurt... are you sure you know what you are doing?',
  greedy: 'Dying was NOT in our deal.', lazy: 'I got up for THAT? Never again.', stalwart: 'That order cost me. Remember it.', aloof: 'Noted. I will trust my own eyes next time.'

const DOUBT = ['This is not a game to me!', 'I will survive my own way.', 'Last time I listened, I nearly died.', 'You can respawn. I cannot.', 'Not this time.'];
function relyAdd(id, n, h) {

  Object.keys(JOBS).forEach(k => { if (!W.lv[k]) W.lv[k] = 1; });
  if (!SV.res) SV.res = {}; ['wood', 'ore', 'herb', 'shroom', 'berry'].forEach(k => { if (SV.res[k] == null) SV.res[k] = 0; });

}
const jobSlots = k => k === 'cook' ? 1 : Math.min(4, 1 + workOf().lv[k]);

  h += '<div class="sect">Piece</div><div class="tabs">' + GSLOTS.map(s => '<button class="tab' + (st.slot === s ? ' on' : '') + '" data-act="slot" data-v="' + s + '">' + (s === 'weapon' ? 'Weapon' : s === 'armor' ? 'Armour' : 'Charm') + '</button>').join('') + '</div>';
  if (st.slot === 'weapon') h += '<div class="tabs">' + Object.keys(CLASSES).map(k => '<button class="tab' + (st.cls === k ? ' on' : '') + '" data-act="cls" data-v="' + k + '">' + icoImg('a_' + CLASSES[k].weapon) + ' ' + CLASSES[k].name + '</button>').join('') + '</div>';
  h += '<div class="sect">Rarity</div><div class="row" style="gap:6px;flex-wrap:wrap">' + [1, 2, 3, 4].map(r => '<button class="btn pf' + (st.rar === r ? ' gold' : '') + '" data-act="rar" data-v="' + r + '"' + (maxR >= r ? '' : ' disabled') + '><span class="t' + r + '">' + RARN[r] + '</span></button>').join('') + '</div>';
  if (maxR < 4) h += '<p class="muted" style="font-size:12px;margin:6px 0 0">' + (maxR === 0 ? craftUnlockTxt(1) + ' to start crafting ' + S.name + ' gear.' : 'Next rarity: ' + craftUnlockTxt(maxR + 1).toLowerCase() + '.') + '</p>';
  const have = (n, v) => '<span style="color:' + (n >= v ? 'var(--text)' : '#ff6d8a') + '">' + fmt(n) + ' / ' + fmt(v) + '</span>';
  h += '<div class="li" style="margin-top:12px"><span class="sico">' + icoImg(st.slot === 'weapon' ? 'a_' + CLASSES[st.cls].weapon : st.slot) + '</span><div class="grow"><b class="t' + st.rar + '">' + RARN[st.rar] + ' ' + S.name + ' ' + (st.slot === 'weapon' ? WNOUN[st.cls][0].toLowerCase() : st.slot === 'armor' ? 'armour' : 'charm') + ' · Lv ' + SV.lvl + '</b><small><span class="essd" style="--sc:' + S.col + '"></span> Essence ' + have(essOf(st.set), c.ess) + ' · ' + icoImg('ore') + ' Ore ' + have(SV.res.ore, c.ore) + ' · ' + icoImg('gold') + ' Gold ' + have(SV.gold, c.gold) + '</small></div><button class="btn pf' + (ok ? ' gold' : '') + '" data-act="make"' + (ok ? '' : ' disabled') + '>Forge it</button></div>';
  if (st.made) { const it = SV.inv.find(x => x.uid === st.made); if (it) h += '<div class="li made"><span class="sico">' + icoImg(itIc(it)) + '</span><div class="grow"><b class="t' + it.rar + '">' + esc(it.name) + '</b><small>' + itemStats(it) + '</small></div><button class="btn pf gold" data-act="open" data-v="' + it.uid + '">Equip it</button></div>'; }
  openModal('Smithy', h, {
    act: {
      set: v => screenCraft(Object.assign(st, { set: v, made: null })), slot: v => screenCraft(Object.assign(st, { slot: v, made: null })),
      cls: v => screenCraft(Object.assign(st, { cls: v, made: null })), rar: v => screenCraft(Object.assign(st, { rar: +v, made: null })),
      make: () => {
        if (!ok) return; if (SV.inv.length >= BAG_MAX) { toast('Your bag is full', ''); return; }
        forgeOf().ess[st.set] -= c.ess; SV.res.ore -= c.ore; SV.gold -= c.gold;
        const it = genItem(SV.lvl, st.rar, st.slot, { set: st.set, cls: st.slot === 'weapon' ? st.cls : null, exact: 1 }); SV.inv.push(it); save(); sfx('level'); refreshLobby();
        toast('<span class="t' + it.rar + '">' + esc(it.name) + '</span> forged', 'gold'); screenCraft(Object.assign(st, { made: it.uid }));
      },
      open: v => { const it = SV.inv.find(x => x.uid === v); const who = it && (SV.party.find(id => SV.owned[id] && canWear(id, it)) || hid); SCREENS.loadout(who, 'all', v); }
    }
  });
}

/* ================= hero stories: three chapters each ================= */
// 'h' = the hero speaking, '' = narration. Chapter 1 never addresses you directly, because
// the hero may not know you exist yet; chapters 2 and 3 only unlock once they do.
const HS_NAMES = ['Who I Am', 'What I Lost', 'What I Fight For'];
const HS_GEMS = [30, 60, 120];
const HSTORY = {
  kael: { resolve: 'The Chosen', c: [
    [['', 'Kael sharpens a chipped sword that is older than he is.'], ['h', 'Back home, they picked teams for the harvest guard every spring. I was never picked. Not once.'], ['h', 'So I trained alone. Every night. Just in case someone ever needed me.']],
    [['h', 'My village was on the Amber Vale. When the Spire came, the guard captain ran. Everyone who was picked ran.'], ['h', 'I stayed. I held the bridge until the last cart crossed. Then the bridge fell, and so did I.'], ['h', 'I woke up in the Starforge. And you picked me. First, out of everyone.']],
    [['h', 'I used to think being chosen was the thing I wanted most.'], ['h', 'It is not. It is being trusted when it counts. You gave me that.'], ['h', 'So let them call me the Unpicked. I know whose side I am on.']]] },
  pip: { resolve: 'The Brother’s Keeper', c: [
    [['', 'Pip is counting coins. Then counting them again.'], ['h', 'Every coin is a promise. Bread tomorrow. A roof next week. Magic does not feed anyone.'], ['h', 'I learned spells off a travelling charlatan. Half of them were fake. The fire ones were real, luckily.']],
    [['h', 'I had a little brother. Tobin. He wanted to be a real wizard, with a tower and a hat.'], ['h', 'I spent our savings on his apprenticeship in the Ashen forges. Two weeks later, the forges went dark.'], ['h', 'I keep the money now. All of it. In case he is out there and needs paying for.']],
    [['h', 'I worked something out. The Ashen forges are on the Spire’s floors. If he is anywhere, he is up there.'], ['h', 'So, partner. New deal. You help me climb, I stop charging you for every spell.'], ['h', '...Okay, half price. I am still me.']]] },
  ilka: { resolve: 'The Thaw-Bringer', c: [
    [['', 'Ilka is stringing a snare out of three different kinds of rope.'], ['h', 'Furs, feathers, a glowing wisp heart if I am lucky. Everything in this tower sells to someone.'], ['h', 'The woods taught me: you eat what you catch.']],
    [['h', 'My family ran the trading post at the edge of the northern isles. Busiest stop for a hundred miles.'], ['h', 'The night it froze, I was out on the trapline. When I came back, there was just snow, falling the wrong way.'], ['h', 'Everyone was still standing there. Frozen mid-sentence. I sold their furs to pay for passage south. I am not proud of it.']],
    [['h', 'Oona says the freeze can break if the floors above are freed. Is that true?'], ['h', 'Then I am not here for the loot anymore. Well. Not ONLY for the loot.'], ['h', 'Let us thaw the north. I owe them a lot of furs.']]] },
  brann: { resolve: 'The Wakeful Gate', c: [
    [['', 'Brann has found a sunny spot and refuses to move from it.'], ['h', 'Twelve years guarding Veyra’s west gate. You know how many times it was attacked? Zero.'], ['h', 'Best job in the world. Shame about the end of the world.']],
    [['h', 'When the Spire rose, the west gate was the first thing it hit. Twelve years of nothing, then everything at once.'], ['h', 'I froze. Just stood there. A girl from the bakery pulled me inside before the wall came down.'], ['h', 'I never learned her name. I sleep a lot, because when I am awake, I think about that.']],
    [['h', 'I asked around Veyra. Her name is Marta. She runs the bakery on Lantern Street now. She remembered me.'], ['h', 'She said I looked like a man who needed a reason to stay awake. I told her I had found one.'], ['h', 'Wake me up for the next fight, Commander. I mean it this time.']]] },
  doran: { resolve: 'The Oath Renewed', c: [
    [['', 'Doran polishes a shield whose crest no longer belongs to any kingdom.'], ['h', 'I swore an oath to the King of the Isles. Protect the crown, protect the people.'], ['h', 'The crown is gone. The oath has no end clause. So I keep it.']],
    [['h', 'The king died on the first night. He climbed the Spire alone to bargain with the thing at the top.'], ['h', 'He came back down as a Hollow. I had to stop him. With this shield.'], ['h', 'There is a dent here. That is where his sword struck last. I will not hammer it out.']],
    [['h', 'I have been thinking about my oath. Protect the crown, protect the people.'], ['h', 'There is no crown. There are only people. Yours, now.'], ['h', 'I swear it again, to you, with no king between us. My shield is yours until the Spire falls.']]] },
  juno: { resolve: 'The Loud Flame', c: [
    [['', 'Juno’s sleeve is on fire. She does not seem to have noticed.'], ['h', 'Fire magic is easy. You get angry, you point, things explode. Teachers hated that.'], ['h', 'I got kicked out of three academies. The third one had to be rebuilt.']],
    [['h', 'My big sister was the real mage. Calm, careful, perfect grades. Everyone loved her.'], ['h', 'She went up the Spire with the first expedition. Nobody came back. Mother stopped saying her name.'], ['h', 'I am not trying to be her. I am trying to be loud enough that she hears me, wherever she is.']],
    [['h', 'I saw her. High in the tower. A Hollow mage in her robes. She did not know me.'], ['h', '...I did not attack. I just shouted her name until she walked away.'], ['h', 'When we free that floor, she is coming home. Be loud with me, Commander.']]] },
  wren: { resolve: 'The Green Keeper', c: [
    [['', 'Wren is mixing a poultice and pointedly not looking at anyone.'], ['h', 'I heal people because I know how. Not because I like them.'], ['h', 'The herb-witch who raised me said the same thing. Then she healed half the village for free every winter.']],
    [['h', 'She saw the Spire coming. Dreamed it. Told the elders. They laughed.'], ['h', 'When it rose, she walked into the forest to hold back the rot with her bare hands. The forest is still green because of her.'], ['h', 'I found her staff in the roots. Nothing else. I do not need anyone. I learned that the hard way.']],
    [['h', 'I noticed something. You check on every one of us after a fight. Even the ones who cannot see you.'], ['h', 'She used to do that. Walk the whole village at dusk. Nobody ever thanked her.'], ['h', '...Thank you. There. I said it. Do not make a thing of it.']]] },
  lumi: { resolve: 'The Promised Light', c: [
    [['', 'Lumi lights a candle for every name she knows. There are a lot of candles.'], ['h', 'I was the candle-keeper at the Veyra chapel. People came to light one for the lost.'], ['h', 'After the Spire rose, we ran out of candles in a week. So I learned to make light myself.']],
    [['h', 'One night a little boy asked me to light a candle for his mother. She was on the Amber Vale.'], ['h', 'I lit it, and then I lied. I said she was probably safe. He smiled, and I have never forgiven myself.'], ['h', 'That is why I climb. I want my lie to become true.']],
    [['h', 'People are coming home from the freed floors. Not everyone. But some.'], ['h', 'His mother was one of them, Commander. She was one of them.'], ['h', 'I will keep lighting candles. But now I light them for the people we are going to bring home.']]] },
  varro: { resolve: 'The Humbled Champion', c: [
    [['', 'Varro practises the same sword form over and over, without a single wasted motion.'], ['h', 'Champion of the Veyra arena, six years running. Undefeated.'], ['h', 'People still ask for my autograph. Rightly so.']],
    [['h', 'Undefeated... until the night of the Spire. A Hollow knight cut through my guard like I was a child.'], ['h', 'Five people died behind me because I believed I could not lose.'], ['h', 'I do not duel anymore. I fight. There is a difference, and it took five lives to teach me.']],
    [['h', 'I let you give me orders. Me. The Champion.'], ['h', 'Do you know why? Because you have never once fought for glory. Only for the people behind us.'], ['h', 'Teach me that, and I will be the blade you deserve.']]] },
  senna: { resolve: 'The Moon’s Answer', c: [
    [['', 'Senna watches the night sky as if she is listening to it.'], ['h', 'The moon temple taught that the stars watch over us. That someone up there cares.'], ['h', 'I believed it. I still do. Lately I think, perhaps, they sent someone.']],
    [['h', 'The temple stood on the highest isle. When the Spire rose, the moon went dark for nine days.'], ['h', 'On the tenth night, the High Priestess walked into the Spire to ask the stars why. She did not return.'], ['h', 'I was left with her prayers and no one to say them to. Until I felt you listening.']],
    [['h', 'I prayed for someone to guide us. I did not expect them to be so... uncertain. So human.'], ['h', 'You make mistakes. You try again. You care. The stars never did that.'], ['h', 'I will not pray to you, then. I will pray with you.']]] },
  kestrel: { resolve: 'The Anchored Wind', c: [
    [['', 'Kestrel sits on the highest branch she can find, alone.'], ['h', 'Wind archers do not belong anywhere. We follow the wind and shoot what it points at.'], ['h', 'Do not get attached. I never stay.']],
    [['h', 'I did stay, once. A sky-ship crew. Seven of us. Best two years of my life.'], ['h', 'The Spire tore the ship out of the sky. I was the only one who could fly. I could have carried one of them.'], ['h', 'I could not choose. So I carried no one. I have not stopped moving since.']],
    [['h', 'The wind has blown toward the Spire for months. I thought it was telling me to leave.'], ['h', 'I think it was telling me to stay. With people I could actually save, this time.'], ['h', 'I am still not attached. I am just... not leaving.']]] },
  rook: { resolve: 'The Pack Leader', c: [
    [['', 'Rook is arm-wrestling a barrel. The barrel is losing.'], ['h', 'Iron Wolves were mercenaries. Best in the isles. We charged first and asked never.'], ['h', 'Need a wall knocked down? I am your wolf.']],
    [['h', 'The Wolves took a contract to hold the Spire’s base the first night. Good pay. Easy job, they said.'], ['h', 'I charged in first like always. When I looked back, the pack was gone. All of them.'], ['h', 'I keep charging so I do not have to look back.']],
    [['h', 'I looked back today. Saw you. Saw everyone. Still there. Still following.'], ['h', 'A pack is not about who charges first. It is about who comes home together.'], ['h', 'Iron Wolves, reformed. You are the alpha. Do not let it go to your head.']]] },
  maelis: { resolve: 'The Forge-Mender', c: [
    [['', 'Maelis traces constellations in the air with a fingertip. They linger, glowing.'], ['h', 'I was the youngest Starweaver in the history of the Academy. I wove my first constellation at nine.'], ['h', 'And yes, I know what you are. A visitor peering through the stars. I have woven them long enough to see the seams.']],
    [['h', 'The Starforge was my design. I built it to summon heroes to save us.'], ['h', 'It worked. It also called something else. The Spire is the shadow the Forge cast.'], ['h', 'Every hero who falls up there... fell because of my brilliance.']],
    [['h', 'I wanted to unmake the Forge. You kept summoning, kept answering prayers. You changed my mind without a word.'], ['h', 'If I unmake it, who answers the people still praying?'], ['h', 'Very well. I will not unmake it. I will perfect it. And you will help me, player.']]] },
  thane: { resolve: 'The Unbroken Peak', c: [
    [['', 'Thane sits like a mountain: still, heavy, patient.'], ['h', 'My people lived inside the Grey Peak isle. We dug, we forged, we endured.'], ['h', 'You are the watcher from the other side. Mountains know when they are being looked at.']],
    [['h', 'When the Spire rose, its roots went straight through the Grey Peak. Our halls split open like eggs.'], ['h', 'I held the main tunnel while the clans escaped. Nine hundred got out. I counted every one.'], ['h', 'Four thousand did not. I count them too. Every night.']],
    [['h', 'My people built a new hall in Veyra. Small. Crowded. Loud with children.'], ['h', 'They asked me to be their king again. I told them I already have a cause, and a commander.'], ['h', 'A mountain does not need a crown. It needs something to protect. Lead on.']]] },
  vesper: { resolve: 'The Returning Dawn', c: [
    [['', 'Vesper’s sword glows faintly, like the first light of morning.'], ['h', 'I am the Dawnblade. Every generation the sword chooses one bearer. This generation, it chose me.'], ['h', 'You play this world like a game. Fine. I have no intention of being a piece you lose.']],
    [['h', 'Before me, the Dawnblade belonged to my mentor, Aric. The wisest man I ever knew.'], ['h', 'He walked into the Spire to end it alone. The sword came back without him, and chose me.'], ['h', 'I have been angry ever since. At him, for leaving. At the sword. At you, for being able to just stop playing.']],
    [['h', 'You have not stopped. Through every fall, every wound, you keep coming back for us.'], ['h', 'Aric would have liked you. He always said a leader is someone who returns.'], ['h', 'Then I will return with you. To the top. The dawn is ours to bring.']]] },
  nyx: { resolve: 'The Door-Closer', c: [
    [['', 'Nyx is talking to something in the dark. The dark seems to be laughing.'], ['h', 'Void magic. Forbidden, obviously. Which is why it is the best magic.'], ['h', 'Oh, and hello, player! It is SO strange being watched from outside the story.']],
    [['h', 'The void talks to me. It always has. When the Spire rose, it started screaming.'], ['h', 'I followed the screaming. High in the tower there is a door, and the void is on the other side, trying to get in.'], ['h', 'The First Commander is not keeping it out. He is holding it open.']],
    [['h', 'I could go through that door. Let the void have me. It would close behind me.'], ['h', '...You looked worried just now. Through the screen. I felt it.'], ['h', 'Fine! New plan. We close it together, and I get to keep existing. Better ending anyway.']]] },
  aurelle: { resolve: 'The Saint Who Stayed', c: [
    [['', 'Wherever Aurelle walks, small flowers bloom between the stones.'], ['h', 'I have healed in this tower longer than any of you know. Floor after floor.'], ['h', 'I know this is a game to you. I do not mind. Games are how people learn to be kind without being afraid.']],
    [['h', 'I was the First Commander’s healer. His very first hero.'], ['h', 'I watched him stop listening to us. Watched him drive us into Hollows, one by one, for being too slow.'], ['h', 'I ran. I have healed the Hollow he made ever since, trying to make up for not stopping him.']],
    [['h', 'When we reach the top, I will have to face him.'], ['h', 'I used to think I would have to fight him. Now I think I will have to forgive him, which is harder.'], ['h', 'Stay with me when that day comes, Commander. I will need someone who chose kindness beside me.']]] },
  moss: { resolve: 'The Wide Awake', c: [
    [['', 'Moss is asleep in a hammock strung between two Spire banners.'], ['h', 'Everyone thinks I am lazy. I am not lazy. I am saving my energy.'], ['h', 'When I do wake up, I never miss. Ask any crow that tried to steal my lunch.']],
    [['h', 'I was a scout for the Mosswatch, back in the green hills. Up all night, every night, watching the treeline.'], ['h', 'The one night I fell asleep, the Hollows came. I woke up to smoke.'], ['h', 'I have not slept properly since. I just close my eyes and hope it is enough.']],
    [['h', 'You know what? With you keeping watch, I actually sleep.'], ['h', 'Real sleep. No smoke in the dreams.'], ['h', 'So when it matters, I will be wide awake. That is a promise, Commander. Mostly.']]] },
  tamsin: { resolve: 'The Last Page', c: [
    [['', 'Tamsin writes on everything: paper, walls, the backs of her own hands.'], ['h', 'Every spell I know is written on a paper charm. Ink, a word, a little breath. That is all magic is.'], ['h', 'I was the scribe of Ashenford. I wrote down everyone who lived there, so no one would be forgotten.']],
    [['h', 'When Ashenford burned, my records burned with it. Three hundred names.'], ['h', 'I remember forty-one. I write them down every night so I do not lose those too.'], ['h', 'Some nights it is forty. I cry on those nights.']],
    [['h', 'I started a new book. The first page has the name of everyone in this party.'], ['h', 'Yours too, Commander. I do not know your real name, so I wrote “the one who chose us.”'], ['h', 'Nobody on that page gets forgotten. I will make sure of it.']]] },
  odda: { resolve: 'The Good Shepherd', c: [
    [['', 'Odda hums to the village goats. They follow her everywhere.'], ['h', 'I kept sheep on the frost hills. Wolves, storms, bad winters. I stood in front of them every time.'], ['h', 'A shield is just a gate you carry with you. That is what my mother said.']],
    [['h', 'When the frost Hollows came down the mountain, I stood in front of the flock like always.'], ['h', 'It was not enough. Nobody can hold a whole hill alone.'], ['h', 'I carried the last lamb all the way to Veyra. She is the white goat by the fountain. Her name is Hope.']],
    [['h', 'You put me in front, and you trust me to hold.'], ['h', 'But you also put others beside me, so I am never holding alone again.'], ['h', 'That is what a good shepherd does, Commander. I would know.']]] },
  sable: { resolve: 'The Debt Paid', c: [
    [['', 'Sable flips a gold coin, catches it, and checks both sides before pocketing it.'], ['h', 'So you are the one pulling the strings from the other side. Fine. Everyone has a price, even gods.'], ['h', 'Mine is simple. You keep me alive, I keep the bounties coming. Fair trade.']],
    [['h', 'You want to know why I count every coin? My little sister owed a debt to the Crown.'], ['h', 'The First Commander paid it off with her. Sent her up the Spire as a “volunteer.” She never came down.'], ['h', 'I have been buying her back one bounty at a time, from a tower that does not sell.']],
    [['h', 'I stopped counting coins last week. Did you notice?'], ['h', 'I worked out that the only bounty worth anything is the one at the top. His.'], ['h', 'No charge for this one, Commander. Call it a gift. I have never said that before.']]] },
  morrow: { resolve: 'The Waking Dream', c: [
    [['', 'Morrow yawns, stretches, and heals three wardens without opening her eyes.'], ['h', 'Oh, hello. I dreamed about you. A window, a glowing screen, someone tapping on the other side.'], ['h', 'I see things when I sleep. It is very tiring. So I sleep more. You understand.']],
    [['h', 'I dreamed of the Spire falling a hundred times before it ever rose. Nobody believed me.'], ['h', 'The last time, I dreamed it so clearly I woke up screaming. Then I heard the bells.'], ['h', 'Now I am afraid to dream, and afraid not to. Napping is a compromise.']],
    [['h', 'Last night I dreamed of the top floor. There was light, and you were there with us.'], ['h', 'It is the first good dream I have had in years.'], ['h', 'So I will stay awake for this one, Commander. I want to see if I was right.']]] },
  grimm: { resolve: 'The Voice', c: [
    [['', 'Grimm stands at the Spire gate every night. He does not speak. He just watches the dark.'], ['h', '...You. The one behind the glass.'], ['h', 'I do not need orders. I need someone to stand in front of. You will do.']],
    [['h', 'I was a warden once. The First Commander’s shield.'], ['h', 'He told me to hold a door while he ran. I held it for three days. When I came out, he was gone, and so was my voice. Ten years of silence.'], ['h', 'Words are expensive. I only spend them on things that matter.']],
    [['h', '...This matters.'], ['h', 'You never left anyone holding a door alone. I noticed.'], ['h', 'When we reach him, I will say one thing to his face. Until then, I stand in front of you.']]] },
  elowen: { resolve: 'The Greenwood Reborn', c: [
    [['', 'Elowen’s arrows are fletched with leaves that never wilt.'], ['h', 'I know what you are, Commander. A visitor. For you, this world fits in your hand.'], ['h', 'For me, it is everything I have left. So I will not ask you to care. I will ask you to aim true.']],
    [['h', 'The Greenwood was the first place the Spire swallowed. A thousand years of trees, gone in a night.'], ['h', 'I was the youngest of the forest guard. The others told me to run and carry the seeds.'], ['h', 'I still have them. One hundred seeds, in a pouch over my heart. I have not found ground safe enough to plant them.']],
    [['h', 'When the Spire falls, I will plant the first seed right where it stood.'], ['h', 'I want you to see it, Commander, even from your side of the glass. The first tree of the new Greenwood.'], ['h', 'I chose you because you chose us. That is how forests work. Everything holds everything else up.']]] }
};
function hsSeen(id) { const o = SV.owned[id]; return (o && o.hs) || 0; }
function hsCan(id, i) {
  const o = SV.owned[id]; if (!o || !HSTORY[id] || i > hsSeen(id)) return false;
  if (i === 0) return bondLv(id) >= 1;
  if (i === 1) return bondLv(id) >= 3 && isAware(id);
  return bondLv(id) >= 5 && (o.wishes || 0) >= 1;
}
function hsNeed(id, i) {
  if (i === 0) return 'Bond level 1';
  if (i === 1) return 'Bond level 3' + (isAware(id) ? '' : ', and ' + HEROES[id].name + ' must know you exist');
  return 'Bond level 5 and one granted wish';
}
function hsNew(id) { const n = hsSeen(id); return n < 3 && hsCan(id, n); }
function playHS(id, i, after) {
  const H = HEROES[id], S = HSTORY[id], o = SV.owned[id]; if (!S || !hsCan(id, i)) return;
  const first = i >= hsSeen(id);
  playStory({ id: 'hs_' + id + i, ch: H.name + ' · Chapter ' + (i + 1), title: HS_NAMES[i], noMark: true, lines: S.c[i].map(([w, t]) => [w === 'h' ? 'h:' + id : w, t]) }, () => {
    if (first) {
      o.hs = i + 1; SV.gems += HS_GEMS[i];

  h += '<div class="pity"><div class="pbar"><span>5★ guaranteed within <b>' + left5 + '</b> summon' + (left5 === 1 ? '' : 's') + (soft ? ' · <em>chance now ' + (Math.min(1, rate5()) * 100).toFixed(1) + '%</em>' : '') + '</span><div class="prog"><i style="width:' + (P.p5 / PITY5 * 100) + '%;background:linear-gradient(90deg,#d8a8ff,#ffc65a)"></i></div></div>';
  h += '<div class="pbar"><span>4★ or better within <b>' + left4 + '</b></span><div class="prog"><i style="width:' + (P.p4 / PITY4 * 100) + '%;background:#d8a8ff"></i></div></div>';
  h += '<button class="btn pf" data-act="spark">✦ ' + P.light + ' Starlight · Exchange</button>' + (SV.ended || (SV.echo && SV.echo.shards) ? '<button class="btn pf" data-act="echo"><span class="eshard sm"></span> ' + fmt(echoOf().shards) + ' Echo Shards</button>' : '') + '</div>';
  h += '<p class="muted" style="text-align:center;font-size:12px;margin:10px 0 0">Rates: 5★ 1.5% · 4★ 6.5% · 3★ 17% · 2★ 30% · 1★ 45%. From summon ' + (SOFT5 + 1) + ' the 5★ chance climbs 6% per summon, and summon ' + PITY5 + ' is always 5★. Every 10th summon without a 4★ gives one. Each ×10 includes a 3★ or better. You have ' + price('gem', SV.gems) + '</p>';
  openModal('Starforge', h, { name: 'forge', act: { s1: () => summon(1), s10: () => summon(10), spark: () => SCREENS.spark(), echo: () => SCREENS.echo() } });
  const c = $('#sumCv'), D = Math.min(2, devicePixelRatio || 1); c.width = c.offsetWidth * D; c.height = c.offsetHeight * D;
  const top = results ? Math.max(...results.map(r => HEROES[r.id].star)) : 0, col = ['#6fe3f5', '#a8aed8', '#7ff09a', '#8fc3ff', '#d8a8ff', '#ffc65a'][top];
  if (results) sfx('summon');
  FORGE.anim = true; const t0 = performance.now(), g = c.getContext('2d'), pts = [];
  for (let i = 0; i < 90; i++) pts.push({ a: rand(0, 6.28), r: rand(10, 140), s: rand(0.5, 2) });
  (function loop(now) {
    if (!FORGE.anim || !c.isConnected) return; const t = (now - t0) / 1000, W = c.width, H = c.height, cx = W / 2, cy = H / 2;
    g.fillStyle = '#0b0a1f'; g.fillRect(0, 0, W, H);
    const gr = g.createRadialGradient(cx, cy, 2, cx, cy, H * 0.7); gr.addColorStop(0, results && t > 0.8 ? col : '#2a5ac8'); gr.addColorStop(1, 'rgba(11,10,31,0)'); g.globalAlpha = results ? Math.min(1, 0.3 + t * 0.6) : 0.5; g.fillStyle = gr; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
    pts.forEach(p => { const a = p.a + t * p.s * (results && t < 0.9 ? 4 : 1), r = p.r * D * (results && t < 0.8 ? 1 - t : 1); g.fillStyle = Math.random() < 0.1 ? '#ffffff' : col; g.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r * 0.6), 2 * D, 2 * D); });
    if (results && t > 0.75 && t < 1.1) { g.globalAlpha = 1 - (t - 0.75) / 0.35; g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
    if (!results || t > 0.9) { g.imageSmoothingEnabled = false; const pr = prop('portal'), k = Math.round(H / 60); g.drawImage(pr, cx - pr.width * k / 2, cy - pr.height * k / 2 - 6 * D, pr.width * k, pr.height * k); g.globalAlpha = 0.85; for (let i = 0; i < 30; i++) { const a = t * 3 + i * 0.5, r = (13 - (i % 10)) * k; g.fillStyle = i % 3 ? col : '#ffffff'; g.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy - 8 * D + Math.sin(a) * r * 0.95 - 2 * k), 2 * k, 2 * k); } g.globalAlpha = 1; }
    requestAnimationFrame(loop);
  })(t0);
};

/* ================= main loop & boot ================= */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  try { if (G.on) { update(dt); render(); updateHUD(dt); } else if (LOBBY.on) renderLobby(dt); }
  catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function boot() {
  loadSave(); gearMigrate(); buildIcons(); setupCanvas(); setupInput(); setupLobby(); refreshLobby();
  tipsInit(); tipQ('welcome');
  Object.keys(SV.owned).forEach(id => checkAwaken(id)); setTimeout(() => { if (LOBBY.on && !$('#modal').className) showBondUps(); }, 900);
  addEventListener('resize', () => { if (G.on) resizeGame(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.on) saveMorale(); save(); } });
  document.addEventListener('gesturestart', e => e.preventDefault()); askPersist();
  // stop the page itself from rubber-banding on iPhone: only real scroll areas may move under a finger
  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1) { e.preventDefault(); return; }
    const sc = e.target.closest && e.target.closest('#mBody, #log');
    if (!sc || sc.scrollHeight <= sc.clientHeight + 1) { if (!(e.target.closest && e.target.closest('.fullcv, #miniCv'))) e.preventDefault(); }
  }, { passive: false });
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => { });
  requestAnimationFrame(frame);
}
boot();
</script>
